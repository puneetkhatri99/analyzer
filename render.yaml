# Render Blueprint: one web service that builds the dashboard (client/) and serves it from the API (server/).
services:
  - type: web
    name: ministry-jobs-analyser
    runtime: python
    plan: free
    buildCommand: cd client && npm ci && npm run build && cd ../server && pip install -r requirements.txt
    # Migrations run before each start (safe to repeat; a failed one stops the deploy, the old one stays live).
    # --up-to 7: 0001-0007 only add tables and columns (IF NOT EXISTS), so the live data is kept. 0008 drops
    # canonical_role and old leftovers, so it waits: check Neon, then run `python -m app.cli migrate` by hand
    # and raise this number when a new migration is added.
    # --proxy-headers: Render's proxy passes the visitor's IP, which the sign-in lockout counts by.
    startCommand: cd server && python -m app.cli migrate --up-to 7 && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_VERSION
        value: "20"
      - key: APP_ENV
        value: production   # with AXIOM_TOKEN set, logs go to Axiom only (Render's disk is wiped on each deploy)
      - key: DATABASE_URL
        sync: false   # your Neon connection string (the -pooler one)
      - key: AXIOM_TOKEN
        sync: false   # Axiom ingest token: logs are also sent to Axiom (server/app/core/logs.py)
      - key: AXIOM_DATASET
        value: analyzer
