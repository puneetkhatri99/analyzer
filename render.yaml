# Render Blueprint: one web service that builds the dashboard (client/) and serves it from the API (server/).
services:
  - type: web
    name: ministry-jobs-analyser
    runtime: python
    plan: free
    buildCommand: cd client && npm ci && npm run build && cd ../server && pip install -r requirements.txt
    startCommand: cd server && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false   # your Neon connection string (the -pooler one)
      - key: AXIOM_TOKEN
        sync: false   # Axiom ingest token: logs are also sent to Axiom (server/app/logs.py)
      - key: AXIOM_DATASET
        value: analyzer
