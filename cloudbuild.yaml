# Cloud Build trigger config: build the Dockerfile, push the image, deploy it to the Cloud Run service.
# `run deploy` with only --image keeps the service's env variables and other settings.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "$_IMAGE", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "$_IMAGE"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ["run", "deploy", "analyzer", "--image", "$_IMAGE", "--region", "us-central1"]
substitutions:
  _IMAGE: gcr.io/$PROJECT_ID/analyzer:$COMMIT_SHA
options:
  logging: CLOUD_LOGGING_ONLY
