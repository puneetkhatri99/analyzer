# Tool settings only: the app is deployed from requirements.txt, not installed as a package.

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "A", "C4", "RUF"]
ignore = [
    "B008",    # FastAPI's Depends()/Query() in defaults is the framework's idiom
    "RUF001",  # en dashes and curly quotes in user-facing text are intended
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "E731", "C408"]
"app/extraction/prompts.py" = ["E501"]  # prompt text is sent as written

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]

# One-way imports: a package may import only the ones below it. `lint-imports` (run from server/) fails on a cycle or an
# upward import. Packages on one line (a | b) must not import each other either.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Features import downward only"
type = "layers"
layers = [
    "app.main | app.cli",  # entry points
    "app.ingestion",  # orchestrator: feeds and syncs call into the features below
    "app.leads | app.extraction",
    "app.report",
    "app.jobs",
    "app.job_pages | app.ai_usage",
    "app.auth",
    "app.shared",
    "app.core",
]
