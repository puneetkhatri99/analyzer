# nginx on the EC2 host: /etc/nginx/sites-available/analyzer (see DEPLOY_EC2.md). Reverse proxy to the app container
# on 127.0.0.1:8080 and per-visitor rate limits. certbot adds the HTTPS (443) part.
# The zones below sit outside "server {}" because limit_req_zone is only allowed at http level, which is where
# sites-enabled files are included.

limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;     # admin sign-in
limit_req_zone $binary_remote_addr zone=signup:10m rate=20r/m;   # public lead sign-up and event tracking
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;      # everything else
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name yourdomain.org;

    server_tokens off;
    client_max_body_size 2m;
    limit_conn perip 30;

    # nginx faces the internet, so it sets (not appends to) the visitor's address: a header can't fake it.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s; # admin AI extraction can take a while

    location = /api/admin/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location ~ ^/api/leads(/events)?$ {
        limit_req zone=signup burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location / { # the dashboard's pages and files
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
}
